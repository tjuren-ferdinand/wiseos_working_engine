version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wiseos-postgres
    environment:
      POSTGRES_USER: wiseos
      POSTGRES_PASSWORD: wiseos
      POSTGRES_DB: wiseos
    ports:
      - "5432:5432"
    volumes:
      - wiseos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiseos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wiseos_pgdata:
