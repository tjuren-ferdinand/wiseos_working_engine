# Railway service config — WiseOS Web
# Set this service's root directory to apps/web in the Railway dashboard.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'node node_modules/next/dist/bin/next start -p ${PORT:-3000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
